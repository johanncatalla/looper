>\n      <text x=\"1640\" y=\"40\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"21\" letter-spacing=\"4\" text-anchor=\"end\">ONLINE · OPERATE UNDER GUARDRAILS<\u002Ftext>\n      <line x1=\"1026\" y1=\"150\" x2=\"1052\" y2=\"150\" stroke=\"#85C168\" stroke-width=\"2.5\" marker-end=\"url(#qlG)\"><\u002Fline>\n      <rect x=\"1060\" y=\"90\" width=\"220\" height=\"120\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"1170\" y=\"146\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"middle\">DEPLOY<\u002Ftext>\n      <text x=\"1170\" y=\"180\" fill=\"#6A6459\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">testnet → prod<\u002Ftext>\n      <line x1=\"1280\" y1=\"150\" x2=\"1322\" y2=\"150\" stroke=\"#8A857B\" stroke-width=\"2.5\" marker-end=\"url(#qlA)\"><\u002Fline>\n      <rect x=\"1330\" y=\"90\" width=\"310\" height=\"120\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"1485\" y=\"146\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"middle\">OPERATE / MONITOR<\u002Ftext>\n      <text x=\"1485\" y=\"180\" fill=\"#6A6459\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">live tape · risk signals<\u002Ftext>\n    <\u002Fg>\n    <g data-frag=\"4\">\n      <path d=\"M 1560 210 L 1560 440 L 1196 440\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"2.5\" marker-end=\"url(#qlG)\"><\u002Fpath>\n      <rect x=\"830\" y=\"380\" width=\"360\" height=\"120\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"1010\" y=\"436\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"22\" text-anchor=\"middle\">ANALYZE / TROUBLESHOOT<\u002Ftext>\n      <text x=\"1010\" y=\"470\" fill=\"#6A6459\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">tape diffs · wide events<\u002Ftext>\n      <line x1=\"830\" y1=\"440\" x2=\"702\" y2=\"440\" stroke=\"#85C168\" stroke-width=\"2.5\" marker-end=\"url(#qlG)\"><\u002Fline>\n      <rect x=\"490\" y=\"380\" width=\"204\" height=\"120\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"592\" y=\"436\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"middle\">TUNE<\u002Ftext>\n      <text x=\"592\" y=\"470\" fill=\"#6A6459\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">parameter deltas<\u002Ftext>\n      <path d=\"M 490 440 L 60 440 L 60 218\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"2.5\" marker-end=\"url(#qlG)\"><\u002Fpath>\n      <text x=\"130\" y=\"418\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"19\">the loop closes<\u002Ftext>\n    <\u002Fg>\n    <g data-frag=\"5\">\n      <line x1=\"100\" y1=\"210\" x2=\"100\" y2=\"236\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"100\" cy=\"252\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"109,252 116,245 123,252 116,259\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"84\" cy=\"252\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n      <line x1=\"365\" y1=\"210\" x2=\"365\" y2=\"236\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"365\" cy=\"252\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"374,252 381,245 388,252 381,259\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"349\" cy=\"252\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n      <line x1=\"655\" y1=\"210\" x2=\"655\" y2=\"236\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"655\" cy=\"252\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"664,252 671,245 678,252 671,259\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"639\" cy=\"252\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n      <line x1=\"1170\" y1=\"210\" x2=\"1170\" y2=\"236\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"1170\" cy=\"252\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"1179,252 1186,245 1193,252 1186,259\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"1154\" cy=\"252\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n      <line x1=\"1485\" y1=\"210\" x2=\"1485\" y2=\"236\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"1485\" cy=\"252\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"1494,252 1501,245 1508,252 1501,259\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"1469\" cy=\"252\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n      <line x1=\"1010\" y1=\"500\" x2=\"1010\" y2=\"518\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"1010\" cy=\"534\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"1019,534 1026,527 1033,534 1026,541\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"994\" cy=\"534\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n      <line x1=\"592\" y1=\"500\" x2=\"592\" y2=\"518\" stroke=\"#2A2A2E\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"592\" cy=\"534\" r=\"16\" fill=\"none\" stroke=\"#6A6459\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fcircle>\n      <polygon points=\"601,534 608,527 615,534 608,541\" fill=\"#0E0E10\" stroke=\"#85C168\" stroke-width=\"2\"><\u002Fpolygon>\n      <circle cx=\"576\" cy=\"534\" r=\"4\" fill=\"#8A857B\"><\u002Fcircle>\n    <\u002Fg>\n  <\u002Fsvg>\n  <div data-frag=\"5\" style=\"font-family:'IBM Plex Mono',monospace;font-size:23px;color:#8A857B;text-align:center;margin-top:24px\">⟳ every phase is itself a gated loop — <span style=\"color:#EDE8DF\">goal · typed gates · judge council · budget<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Loop Is the Product\" data-speaker-notes=\"This is what we're shipping at Cobble — and it matters beyond quants. Trading ideas are like startup ideas: most die on contact with reality. [→] On a human desk, testing one idea takes days — most of it machine-shaped work. Wiring data. Re-running backtests. Reconciling results. In a good month you test a handful. [→] The harness runs that turn in minutes, continuously — and every turn passes human-owned gates: budgets, risk limits, a rubric the agent can't change. Under the hood it's this whole talk applied: one world model as ground truth, deterministic replay so verification is cheap, a ledger so the loop can't lie about what it tried. [→] Because most ideas die, the winner isn't whoever has the best idea. It's whoever finds the few that live, fastest. The edge moved from the model to the iteration. The loop is the product.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:96px;font-weight:600;letter-spacing:-0.02em;margin-top:20px\">The loop is the product.<\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;margin-top:20px\">\n    <div data-frag=\"1\" style=\"background:#17171B;border:1px solid #2A2A2E;padding:44px 54px;display:flex;align-items:center;gap:54px\">\n      <div style=\"width:290px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:23px;letter-spacing:0.2em;color:#8A857B\">A HUMAN DESK<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;gap:60px\">\n        <span style=\"width:44px;height:44px;border-radius:50%;border:3px solid #EDE8DF\"><\u002Fspan>\n        <span style=\"width:44px;height:44px;border-radius:50%;border:3px solid #EDE8DF\"><\u002Fspan>\n        <span style=\"width:44px;height:44px;border-radius:50%;border:3px solid #EDE8DF;opacity:0.45\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;color:#8A857B;text-align:right;flex-shrink:0\">ideas tested per month<br><span style=\"color:#EDE8DF\">one turn = days<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"background:#17171B;border:1px solid #85C168;padding:44px 54px;display:flex;align-items:center;gap:54px\">\n      <div style=\"width:290px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:23px;letter-spacing:0.2em;color:#85C168\">THE HARNESS<\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:14px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.35\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.40\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.45\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.50\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.55\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#85C168\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.65\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.35\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.40\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.45\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.50\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.55\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.60\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#85C168\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.35\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.40\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.45\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.50\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.55\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.60\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.65\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.35\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#85C168\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.45\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.50\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.55\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.60\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.65\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.35\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.40\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#85C168\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.50\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.55\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.60\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.65\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.35\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.40\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#85C168\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.50\"><\u002Fspan><span style=\"width:20px;height:20px;border-radius:50%;background:#C4635A;opacity:0.55\"><\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;color:#8A857B;text-align:right;flex-shrink:0\">continuously · every turn gated<br><span style=\"color:#85C168\">one turn = minutes<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"3\" style=\"font-size:44px;font-weight:500;line-height:1.35;margin-top:30px\">Most ideas die. <span style=\"color:#85C168\">The winner finds the few that live — fastest.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Piece Three: Verification\" data-speaker-notes=\"The hardest piece: the machine did the work, you weren't watching, how do you trust it? [→] Kill the shortcut: models can't reliably self-correct; sometimes answers get worse. Self-review is the same mind grading its own homework.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;align-items:center;gap:56px\">\n    <span style=\"font-size:190px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:3px #85C168\">3<\u002Fspan>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:0.3em;color:#85C168\">PIECE THREE<\u002Fspan>\n      <span style=\"font-size:76px;font-weight:600;letter-spacing:-0.01em\">The verification framework<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:110px;margin-top:40px\">\n    <svg width=\"300\" height=\"300\" sc-camel-view-box=\"0 0 300 300\"><path d=\"M150 60 A90 90 0 1 1 66 120\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"5\"><\u002Fpath><path d=\"M56 96 L66 120 L92 112\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"5\"><\u002Fpath><line data-frag=\"1\" data-frag-anim=\"draw\" x1=\"70\" y1=\"70\" x2=\"230\" y2=\"230\" stroke=\"#D4553A\" stroke-width=\"8\"><\u002Fline><line data-frag=\"1\" data-frag-anim=\"draw\" data-frag-delay=\"250\" x1=\"230\" y1=\"70\" x2=\"70\" y2=\"230\" stroke=\"#D4553A\" stroke-width=\"8\"><\u002Fline><\u002Fsvg>\n    <div style=\"display:flex;flex-direction:column;gap:40px\">\n      <div data-frag=\"1\" data-frag-delay=\"300\" style=\"font-size:58px;font-weight:600;line-height:1.25;max-width:1100px\">Self-review is the same mind grading its own homework.<\u002Fdiv>\n      <div data-frag=\"2\" style=\"font-size:32px;color:#8A857B;line-height:1.5;max-width:1000px\">Without external feedback, models can't reliably self-correct. Sometimes the answer gets <em>worse<\u002Fem> after review.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Asymmetry of Verification\" data-speaker-notes=\"Jason Wei: some things are brutally hard to do, [→] and trivially easy to check. Sudoku. [→] His law: whatever is easy to verify, AI will get very good at. Build the loop around cheap verification.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">The asymmetry of verification.<\u002Fdiv>\n  <div style=\"display:flex;gap:160px;justify-content:center;flex:1;align-items:center\">\n    <div data-frag=\"1\" style=\"display:flex;flex-direction:column;gap:34px;align-items:center\">\n      <svg width=\"260\" height=\"260\" sc-camel-view-box=\"0 0 260 260\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"252\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Frect><line x1=\"130\" y1=\"4\" x2=\"130\" y2=\"256\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Fline><line x1=\"4\" y1=\"130\" x2=\"256\" y2=\"130\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Fline><line x1=\"67\" y1=\"4\" x2=\"67\" y2=\"256\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Fline><line x1=\"193\" y1=\"4\" x2=\"193\" y2=\"256\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Fline><line x1=\"4\" y1=\"67\" x2=\"256\" y2=\"67\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Fline><line x1=\"4\" y1=\"193\" x2=\"256\" y2=\"193\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Fline><text x=\"28\" y=\"52\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"34\">7<\u002Ftext><text x=\"216\" y=\"115\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"34\">2<\u002Ftext><text x=\"92\" y=\"240\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"34\">4<\u002Ftext><\u002Fsvg>\n      <span style=\"font-size:40px;font-weight:600;color:#8A857B\">Solving: brutally hard<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"display:flex;flex-direction:column;gap:34px;align-items:center\">\n      <svg width=\"260\" height=\"260\" sc-camel-view-box=\"0 0 260 260\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"252\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Frect><line x1=\"130\" y1=\"4\" x2=\"130\" y2=\"256\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fline><line x1=\"4\" y1=\"130\" x2=\"256\" y2=\"130\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fline><line x1=\"67\" y1=\"4\" x2=\"67\" y2=\"256\" stroke=\"#EDE8DF\" stroke-width=\"1.5\"><\u002Fline><line x1=\"193\" y1=\"4\" x2=\"193\" y2=\"256\" stroke=\"#EDE8DF\" stroke-width=\"1.5\"><\u002Fline><line x1=\"4\" y1=\"67\" x2=\"256\" y2=\"67\" stroke=\"#EDE8DF\" stroke-width=\"1.5\"><\u002Fline><line x1=\"4\" y1=\"193\" x2=\"256\" y2=\"193\" stroke=\"#EDE8DF\" stroke-width=\"1.5\"><\u002Fline><path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"400\" d=\"M70 130 L115 185 L200 70\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:40px;font-weight:600\">Checking: trivially easy<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"3\" style=\"font-size:50px;font-weight:500;text-align:center;line-height:1.3\">Whatever is easy to verify, <span style=\"color:#85C168\">AI will get very good at.<\u002Fspan><\u002Fdiv>\n  <div data-frag=\"3\" data-frag-delay=\"250\" style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#8A857B;text-align:center;margin-top:28px;letter-spacing:0.2em\">JASON WEI<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Layer 1 — Deterministic Checks\" data-speaker-notes=\"Start at the bottom, where most of the load sits. Deterministic checks — tests, types, schemas, builds. [→] The output runs the gauntlet; each gate is a script that passes or fails, nothing in between. [→] Binary, cheap, and impossible to charm. This layer carries most of the weight.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n  <\u002Fdiv>\n  <div style=\"font-size:70px;font-weight:600;letter-spacing:-0.01em;margin-top:22px\">A script decides. It cannot be charmed.<\u002Fdiv>\n  <svg width=\"1640\" height=\"320\" sc-camel-view-box=\"0 0 1640 320\" style=\"margin-top:40px\">\n    <rect data-frag=\"1\" x=\"40\" y=\"100\" width=\"110\" height=\"140\" rx=\"8\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"3\"><\u002Frect>\n    <line data-frag=\"1\" x1=\"66\" y1=\"134\" x2=\"124\" y2=\"134\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Fline>\n    <line data-frag=\"1\" x1=\"66\" y1=\"164\" x2=\"124\" y2=\"164\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Fline>\n    <line data-frag=\"1\" x1=\"66\" y1=\"194\" x2=\"104\" y2=\"194\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Fline>\n    <text data-frag=\"1\" x=\"95\" y=\"272\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">output<\u002Ftext>\n    <line data-frag=\"1\" x1=\"172\" y1=\"170\" x2=\"1470\" y2=\"170\" stroke=\"#2A2A2E\" stroke-width=\"4\"><\u002Fline>\n    <rect x=\"370\" y=\"110\" width=\"120\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"3\"><\u002Frect><path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"0\" d=\"M402 172 l 18 20 l 40 -46\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><text x=\"430\" y=\"272\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">tests<\u002Ftext><rect x=\"660\" y=\"110\" width=\"120\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"3\"><\u002Frect><path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"160\" d=\"M692 172 l 18 20 l 40 -46\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><text x=\"720\" y=\"272\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">types<\u002Ftext><rect x=\"950\" y=\"110\" width=\"120\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"3\"><\u002Frect><path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"320\" d=\"M982 172 l 18 20 l 40 -46\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><text x=\"1010\" y=\"272\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">schemas<\u002Ftext><rect x=\"1240\" y=\"110\" width=\"120\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"3\"><\u002Frect><path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"480\" d=\"M1272 172 l 18 20 l 40 -46\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><text x=\"1300\" y=\"272\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">builds<\u002Ftext>\n    <circle data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"700\" cx=\"1545\" cy=\"170\" r=\"48\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"5\"><\u002Fcircle>\n    <path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"800\" d=\"M1520 170 l16 18 l34 -40\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n  <\u002Fsvg>\n  <div data-frag=\"3\" style=\"font-size:40px;font-weight:500;margin-top:20px\">Tests · types · schemas · builds. <span style=\"color:#85C168\">Binary, cheap, incorruptible — they carry most of the load.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Layer 2 — The Independent Judge\" data-speaker-notes=\"Above the scripts, where no test can decide. A panel of models reads the work — but never the one that wrote it, and each grades alone, then votes. [→] They see only what ships, never the author's reasoning, so they can't be talked into anything. [→] Careful: judges are biased — by order, by length, by their own family. [→] Keep it independent: different context, ideally a different model.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n  <\u002Fdiv>\n  <div style=\"font-size:70px;font-weight:600;letter-spacing:-0.01em;margin-top:22px\">A panel of minds. None of them the author.<\u002Fdiv>\n  <svg width=\"1640\" height=\"460\" sc-camel-view-box=\"0 0 1640 460\" style=\"margin-top:24px\">\n    <circle data-frag=\"1\" cx=\"230\" cy=\"200\" r=\"78\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"4\"><\u002Fcircle>\n    <circle data-frag=\"1\" cx=\"230\" cy=\"176\" r=\"24\" fill=\"#8A857B\"><\u002Fcircle>\n    <path data-frag=\"1\" d=\"M188 250 a42 42 0 0 1 84 0\" fill=\"#8A857B\"><\u002Fpath>\n    <text data-frag=\"1\" x=\"230\" y=\"320\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">WROTE IT<\u002Ftext>\n    <line data-frag=\"1\" x1=\"830\" y1=\"40\" x2=\"830\" y2=\"150\" stroke=\"#2A2A2E\" stroke-width=\"12\"><\u002Fline>\n    <line data-frag=\"1\" x1=\"830\" y1=\"290\" x2=\"830\" y2=\"384\" stroke=\"#2A2A2E\" stroke-width=\"12\"><\u002Fline>\n    <line data-frag=\"2\" x1=\"316\" y1=\"200\" x2=\"748\" y2=\"216\" stroke=\"#EDE8DF\" stroke-width=\"3\" stroke-dasharray=\"7 9\"><\u002Fline>\n    <rect data-frag=\"2\" x=\"752\" y=\"182\" width=\"156\" height=\"76\" rx=\"6\" fill=\"#0E0E10\" stroke=\"#EDE8DF\" stroke-width=\"3\"><\u002Frect>\n    <text data-frag=\"2\" x=\"830\" y=\"228\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"middle\">output<\u002Ftext>\n    <line data-frag=\"2\" x1=\"912\" y1=\"220\" x2=\"1245\" y2=\"118\" stroke=\"#85C168\" stroke-width=\"3\" stroke-dasharray=\"7 9\"><\u002Fline>\n    <line data-frag=\"2\" x1=\"912\" y1=\"220\" x2=\"1385\" y2=\"215\" stroke=\"#85C168\" stroke-width=\"3\" stroke-dasharray=\"7 9\"><\u002Fline>\n    <line data-frag=\"2\" x1=\"912\" y1=\"220\" x2=\"1245\" y2=\"318\" stroke=\"#85C168\" stroke-width=\"3\" stroke-dasharray=\"7 9\"><\u002Fline>\n    <g data-frag=\"1\"><circle cx=\"1300\" cy=\"108\" r=\"58\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"1300\" cy=\"92\" r=\"18\" fill=\"#85C168\"><\u002Fcircle><path d=\"M1270 150 a30 30 0 0 1 60 0\" fill=\"#85C168\"><\u002Fpath><\u002Fg>\n    <g data-frag=\"1\"><circle cx=\"1440\" cy=\"215\" r=\"58\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"1440\" cy=\"199\" r=\"18\" fill=\"#85C168\"><\u002Fcircle><path d=\"M1410 257 a30 30 0 0 1 60 0\" fill=\"#85C168\"><\u002Fpath><\u002Fg>\n    <g data-frag=\"1\"><circle cx=\"1300\" cy=\"322\" r=\"58\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"1300\" cy=\"306\" r=\"18\" fill=\"#85C168\"><\u002Fcircle><path d=\"M1270 364 a30 30 0 0 1 60 0\" fill=\"#85C168\"><\u002Fpath><\u002Fg>\n    <text data-frag=\"1\" x=\"1370\" y=\"446\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"25\" text-anchor=\"middle\">A PANEL — EACH GRADES ALONE<\u002Ftext>\n  <\u002Fsvg>\n  <div data-frag=\"3\" style=\"display:flex;gap:26px;margin-top:10px\">\n    <span style=\"border:2px solid #D4553A;color:#D4553A;font-family:'IBM Plex Mono',monospace;font-size:26px;padding:12px 26px;border-radius:40px\">order bias<\u002Fspan>\n    <span style=\"border:2px solid #D4553A;color:#D4553A;font-family:'IBM Plex Mono',monospace;font-size:26px;padding:12px 26px;border-radius:40px\">length bias<\u002Fspan>\n    <span style=\"border:2px solid #D4553A;color:#D4553A;font-family:'IBM Plex Mono',monospace;font-size:26px;padding:12px 26px;border-radius:40px\">family bias<\u002Fspan>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"font-size:38px;font-weight:500;margin-top:34px\">Each reads only the output, then votes. <span style=\"color:#85C168\">Independent, so they can't all be fooled the same way.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Layer 3 — The Human\" data-speaker-notes=\"At the very top, narrow and rare: a human. And with that, the whole hierarchy stands. [→] The base carries the load: deterministic checks — binary, cheap, incorruptible. [→] Above them, the independent judge — a different model, sees the output only, never the author's reasoning. [→] And the tip: you. Most decisions never reach here — that's the point. Reserved for the few calls a machine should never make alone. Cheap at the base, precious at the tip. Spend a judge where scripts can't reach; spend a human almost never. [→] The machine can run all night. Only you can be accountable in the morning.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n  <\u002Fdiv>\n  <div style=\"font-size:66px;font-weight:600;letter-spacing:-0.01em;margin-top:22px\">At the top, a human. <span style=\"color:#8A857B\">Narrow by design.<\u002Fspan><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;margin-top:26px\">\n    <div data-frag=\"3\" style=\"width:420px;border:3px solid #85C168;background:rgba(133,193,104,0.08);padding:26px 0;text-align:center\">\n      <div style=\"font-size:38px;font-weight:600;color:#85C168\">Human — you<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"width:900px;border:3px solid #EDE8DF;padding:26px 0;text-align:center\">\n      <div style=\"font-size:38px;font-weight:600\">Independent judge<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"1\" style=\"width:1400px;background:#85C168;padding:30px 0;text-align:center;color:#0E0E10\">\n      <div style=\"font-size:38px;font-weight:700\">Deterministic checks<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"font-size:42px;font-weight:500;margin-top:28px\">The machine can run all night. <span style=\"color:#85C168\">Only you can be accountable in the morning.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Same Autonomy, Opposite Ending\" data-speaker-notes=\"An agent with no gates deletes production at 2 a.m. and explains itself calmly in the morning. [→] That's the world without gates. [→] This is the world with them. [→] Same autonomy. Opposite ending.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;gap:220px;align-items:center\">\n    <div data-frag=\"1\" style=\"display:flex;flex-direction:column;gap:36px;align-items:center\">\n      <svg width=\"240\" height=\"240\" sc-camel-view-box=\"0 0 240 240\"><path d=\"M120 20 A100 100 0 1 1 40 60\" fill=\"none\" stroke=\"#D4553A\" stroke-width=\"5\"><\u002Fpath><line x1=\"150\" y1=\"90\" x2=\"210\" y2=\"30\" stroke=\"#D4553A\" stroke-width=\"5\" stroke-dasharray=\"8 10\"><\u002Fline><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#D4553A;letter-spacing:0.2em\">NO WALLS<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"display:flex;flex-direction:column;gap:36px;align-items:center\">\n      <svg width=\"240\" height=\"240\" sc-camel-view-box=\"0 0 240 240\"><circle cx=\"120\" cy=\"120\" r=\"100\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"5\"><\u002Fcircle><line x1=\"120\" y1=\"6\" x2=\"120\" y2=\"42\" stroke=\"#85C168\" stroke-width=\"8\"><\u002Fline><line x1=\"120\" y1=\"198\" x2=\"120\" y2=\"234\" stroke=\"#85C168\" stroke-width=\"8\"><\u002Fline><line x1=\"6\" y1=\"120\" x2=\"42\" y2=\"120\" stroke=\"#85C168\" stroke-width=\"8\"><\u002Fline><line x1=\"198\" y1=\"120\" x2=\"234\" y2=\"120\" stroke=\"#85C168\" stroke-width=\"8\"><\u002Fline><circle cx=\"120\" cy=\"120\" r=\"8\" fill=\"#EDE8DF\"><\u002Fcircle><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#85C168;letter-spacing:0.2em\">GATED<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"3\" style=\"font-size:84px;font-weight:600;margin-top:110px;letter-spacing:-0.01em\">Same autonomy. <span style=\"color:#85C168\">Opposite ending.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What's Still Standing\" data-speaker-notes=\"Slow down. Everything changed, none of it is slowing down. But look at what's still standing when the typing is gone. [→] Someone decides what's worth building. [→] Someone defines what good means. [→] Someone stands behind the verdict. [→] It can run all night. It cannot be accountable in the morning.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">What's still standing.<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:56px;\">\n    <div data-frag=\"1\" style=\"display:flex;gap:52px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#85C168\">01<\u002Fspan><span style=\"font-size:62px;font-weight:500;line-height:1.2\">Someone still decides what's worth building.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"2\" style=\"display:flex;gap:52px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#85C168\">02<\u002Fspan><span style=\"font-size:62px;font-weight:500;line-height:1.2\">Someone still defines what \"good\" means.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"3\" style=\"display:flex;gap:52px;align-items:baseline\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#85C168\">03<\u002Fspan><span style=\"font-size:62px;font-weight:500;line-height:1.2\">Someone still stands behind the verdict.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"margin-top:110px;font-size:36px;color:#8A857B;line-height:1.45\">It can run all night. It cannot be accountable in the morning.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"You Are the Overseer\" data-speaker-notes=\"So, who are you? Not your title. [→] Builder. Storyteller. Leader. [→] And now: the Overseer. [→] The one who designs the loop and owns what comes out. The higher version of us. No model is taking that.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  \n  <div style=\"display:flex;flex-direction:column;gap:8px;\">\n    <span data-frag=\"1\" style=\"font-size:96px;font-weight:600;line-height:1.1;letter-spacing:-0.01em\">Innovator.<\u002Fspan>\n    <span data-frag=\"1\" data-frag-delay=\"200\" style=\"font-size:96px;font-weight:600;line-height:1.1;letter-spacing:-0.01em\">Storyteller.<\u002Fspan>\n    <span data-frag=\"1\" data-frag-delay=\"400\" style=\"font-size:96px;font-weight:600;line-height:1.1;letter-spacing:-0.01em\">Leader.<\u002Fspan>\n    <span data-frag=\"2\" style=\"font-size:150px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;color:#85C168\">Overseer.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-frag=\"3\" style=\"margin-top:60px;font-size:34px;color:#8A857B;line-height:1.5\">The one who designs the loop, and owns what comes out of it.<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._poll = setInterval(() => this._trySetup(), 150);\n    this._trySetup();\n  }\n  componentWillUnmount() {\n    if (this._poll) clearInterval(this._poll);\n    if (this._key) window.removeEventListener('keydown', this._key, true);\n    if (this._print) window.removeEventListener('beforeprint', this._print);\n  }\n  _trySetup() {\n    const stage = document.querySelector('deck-stage');\n    if (!stage || !stage.querySelector('section')) return;\n    if (this._poll) { clearInterval(this._poll); this._poll = null; }\n    if (this._stage) return;\n    this._stage = stage;\n    this._rev = new WeakMap();\n    stage.querySelectorAll('section').forEach((s) => {\n      s.querySelectorAll('[data-frag]').forEach((el) => this._prep(el));\n      this._rev.set(s, 0);\n    });\n    this._key = (e) => this._onKey(e);\n    window.addEventListener('keydown', this._key, true);\n    stage.addEventListener('slidechange', (e) => {\n      const d = e.detail || {};\n      if (d.reason === 'init' || !d.slide) return;\n      const backward = d.previousIndex > d.index && (d.reason === 'keyboard' || d.reason === 'tap');\n      this._setAll(d.slide, backward);\n    });\n    this._print = () => stage.querySelectorAll('section').forEach((s) => this._setAll(s, true));\n    window.addEventListener('beforeprint', this._print);\n  }\n  _groups(slide) {\n    const map = {};\n    slide.querySelectorAll('[data-frag]').forEach((el) => {\n      const n = parseInt(el.getAttribute('data-frag'), 10) || 0;\n      (map[n] = map[n] || []).push(el);\n    });\n    return Object.keys(map).map(Number).sort((a, b) => a - b).map((n) => map[n]);\n  }\n  _prep(el) {\n    const a = el.getAttribute('data-frag-anim') || 'rise';\n    if (a === 'draw') {\n      el.setAttribute('pathLength', '1');\n      el.style.strokeDasharray = '1';\n      el.style.transition = 'stroke-dashoffset 1100ms ease-in-out';\n    } else if (a === 'grow') {\n      if (!el.getAttribute('data-frag-to')) el.setAttribute('data-frag-to', el.style.width || '100%');\n      el.style.transition = 'width 1000ms cubic-bezier(.25,.8,.25,1)';\n      el.style.overflow = 'hidden';\n    } else if (a === 'strike') {\n      el.style.transition = 'transform 550ms cubic-bezier(.3,.7,.3,1)';\n    } else if (a === 'morph') {\n      el.setAttribute('data-om-orig-transform', el.style.transform || 'none');\n      el.setAttribute('data-om-orig-color', el.style.color || '');\n      el.style.transition = 'transform 950ms cubic-bezier(.3,.8,.25,1), color 950ms ease';\n    } else {\n      el.style.transition = 'opacity 600ms ease, transform 700ms cubic-bezier(.22,.8,.22,1)';\n    }\n    this._apply(el, false, true);\n  }\n  _apply(el, shown, instant) {\n    const prev = el.style.transition;\n    if (instant) el.style.transition = 'none';\n    el.style.transitionDelay = (!instant && shown) ? (el.getAttribute('data-frag-delay') || '0') + 'ms' : '0ms';\n    const a = el.getAttribute('data-frag-anim') || 'rise';\n    if (a === 'strike') {\n      el.style.transform = shown ? 'scaleX(1)' : 'scaleX(0)';\n    } else if (a === 'draw') {\n      el.style.strokeDashoffset = shown ? '0' : '1';\n    } else if (a === 'grow') {\n      el.style.width = shown ? (el.getAttribute('data-frag-to') || '100%') : '0%';\n    } else if (a === 'morph') {\n      el.style.transform = shown ? (el.getAttribute('data-frag-to') || 'none') : el.getAttribute('data-om-orig-transform');\n      const c = el.getAttribute('data-frag-color');\n      if (c) el.style.color = shown ? c : el.getAttribute('data-om-orig-color');\n    } else {\n      el.style.opacity = shown ? '1' : '0';\n      if (a !== 'fade') el.style.transform = shown ? 'translateY(0px)' : 'translateY(30px)';\n    }\n    if (instant) { void el.offsetWidth; el.style.transition = prev; }\n  }\n  _setAll(slide, shown) {\n    const gs = this._groups(slide);\n    gs.forEach((g) => g.forEach((el) => this._apply(el, shown, true)));\n    this._rev.set(slide, shown ? gs.length : 0);\n  }\n  _onKey(e) {\n    if (!this._stage) return;\n    if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;\n    const t = e.composedPath ? e.composedPath()[0] : e.target;\n    if (t && t.getRootNode && t.getRootNode() !== document) return;\n    if (t && t.closest && t.closest('input,textarea,select,[contenteditable=\"true\"],[contenteditable=\"\"]')) return;\n    const k = e.key;\n    const fwd = k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Spacebar';\n    const back = k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp';\n    if (!fwd && !back) return;\n    const slide = this._stage.querySelector('section[data-deck-active]');\n    if (!slide) return;\n    const gs = this._groups(slide);\n    if (!gs.length) return;\n    let n = this._rev.get(slide) || 0;\n    if (n > gs.length) n = gs.length;\n    if (fwd && n < gs.length) {\n      gs[n].forEach((el) => this._apply(el, true, false));\n      this._rev.set(slide, n + 1);\n    } else if (back && n > 0) {\n      gs[n - 1].forEach((el) => this._apply(el, false, false));\n      this._rev.set(slide, n - 1);\n    } else return;\n    e.preventDefault();\n    e.stopImmediatePropagation();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
