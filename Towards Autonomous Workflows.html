ge: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9d59ad3d-b777-45de-8abd-253e4955e3ab\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>html,body{margin:0;padding:0;background:#0E0E10}a{color:#85C168;text-decoration:none}a:hover{color:#EDE8DF}@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.28}}@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes flowDash{to{stroke-dashoffset:-36}}<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"8090f18d-eb8f-427a-b4bf-78bfc44d266d#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<section data-label=\"Sino Ka Ba?\" data-speaker-notes=\"Who are you? Pause, let it get uncomfortable. [→] Sino ka ba? Titles are fine answers, but not the real one.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;position:relative;overflow:hidden\">\n  <svg width=\"1000\" height=\"1000\" sc-camel-view-box=\"0 0 1000 1000\" style=\"position:absolute;right:-320px;top:-320px\"><circle cx=\"500\" cy=\"500\" r=\"420\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"2\" stroke-dasharray=\"4 14\" opacity=\"0.6\"><\u002Fcircle><circle cx=\"920\" cy=\"500\" r=\"9\" fill=\"#85C168\"><\u002Fcircle><\u002Fsvg>\n  \n  \n  <div style=\"position:absolute;bottom:80px;left:140px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.25em;color:#8A857B\">JOHANN CATALLA · KODECRAFT<\u002Fdiv>\n<div data-frag=\"1\" style=\"font-size: 190px; font-weight: 600; line-height: 1.02; letter-spacing: -0.02em; margin-top: 36px\">What's your job?<\u002Fdiv><\u002Fsection>\n\n<section data-label=\"Builder. Storyteller. Leader.\" data-speaker-notes=\"The title on your badge. [→] Fine answers, but not the real one. [→] Underneath, something older than any job description. [→] These don't expire, no matter how smart the next model gets.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;position:relative;overflow:hidden\">\n  <div data-frag=\"2\" data-frag-anim=\"morph\" data-frag-to=\"translate(1000px, 260px) scale(0.48)\" data-frag-color=\"#8A857B\" style=\"position:absolute;left:140px;top:0;transform:translate(0px, 340px) scale(1);transform-origin:left top;display:flex;flex-direction:column;gap:20px;color:#EDE8DF;z-index:2\">\n    <span style=\"position:relative;font-size:110px;font-weight:600;line-height:1.12;white-space:nowrap\">Software Engineer<span data-frag=\"1\" data-frag-anim=\"strike\" style=\"position:absolute;left:-14px;right:-14px;top:52%;height:9px;background:#D4553A;transform-origin:left center\"><\u002Fspan><\u002Fspan>\n    <span style=\"position:relative;font-size:110px;font-weight:600;line-height:1.12;white-space:nowrap\">Data Scientist<span data-frag=\"1\" data-frag-anim=\"strike\" data-frag-delay=\"180\" style=\"position:absolute;left:-14px;right:-14px;top:52%;height:9px;background:#D4553A;transform-origin:left center\"><\u002Fspan><\u002Fspan>\n    <span style=\"position:relative;font-size:110px;font-weight:600;line-height:1.12;white-space:nowrap\">Project Manager<span data-frag=\"1\" data-frag-anim=\"strike\" data-frag-delay=\"360\" style=\"position:absolute;left:-14px;right:-14px;top:52%;height:9px;background:#D4553A;transform-origin:left center\"><\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\">\n    <div data-frag=\"2\" data-frag-delay=\"450\" style=\"display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:140px;font-weight:600;line-height:1.08;letter-spacing:-0.02em\">Innovator.<\u002Fspan>\n      <span style=\"font-size:140px;font-weight:600;line-height:1.08;letter-spacing:-0.02em\">Storyteller.<\u002Fspan>\n      <span style=\"font-size:140px;font-weight:600;line-height:1.08;letter-spacing:-0.02em\">Leader.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"3\" style=\"margin-top:48px;font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:0.2em;color:#85C168;text-transform:uppercase\">These don't expire.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Shift\" data-speaker-notes=\"Not even four years. [→] 2022: a chat box you operated by hand. [→] Then a harness, Claude Code, agents in your repo while you watch. [→] Now the work runs while nobody's watching.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">Not even four years.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:48px;align-items:center;\">\n    <div data-frag=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n      <svg width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 150 150\"><rect x=\"15\" y=\"30\" width=\"120\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Frect><circle cx=\"55\" cy=\"70\" r=\"6\" fill=\"#EDE8DF\"><\u002Fcircle><circle cx=\"80\" cy=\"70\" r=\"6\" fill=\"#EDE8DF\"><\u002Fcircle><circle cx=\"105\" cy=\"70\" r=\"6\" fill=\"#EDE8DF\"><\u002Fcircle><path d=\"M40 110 L40 130 L60 110\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">2022<\u002Fdiv>\n      <div style=\"font-size:46px;font-weight:600\">The chat box<\u002Fdiv>\n      <div style=\"font-size:29px;color:#8A857B;line-height:1.4\">You operate it by hand, one message at a time.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"font-size:44px;color:#8A857B\">→<\u002Fdiv>\n    <div data-frag=\"2\" data-frag-delay=\"150\" style=\"display:flex;flex-direction:column;gap:28px\">\n      <svg width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 150 150\"><rect x=\"45\" y=\"45\" width=\"60\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Frect><path d=\"M28 30 L10 30 L10 120 L28 120\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fpath><path d=\"M122 30 L140 30 L140 120 L122 120\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fpath><line x1=\"10\" y1=\"75\" x2=\"45\" y2=\"75\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fline><line x1=\"105\" y1=\"75\" x2=\"140\" y2=\"75\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fline><\u002Fsvg>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">2024<\u002Fdiv>\n      <div style=\"font-size:46px;font-weight:600\">The harness<\u002Fdiv>\n      <div style=\"font-size:29px;color:#8A857B;line-height:1.4\">Agents read the repo, run the tests while you watch.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"3\" style=\"font-size:44px;color:#8A857B\">→<\u002Fdiv>\n    <div data-frag=\"3\" data-frag-delay=\"150\" style=\"display:flex;flex-direction:column;gap:28px\">\n      <svg width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 150 150\"><path d=\"M75 15 A60 60 0 1 1 23 45\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fpath><path d=\"M14 24 L23 45 L44 38\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">Now<\u002Fdiv>\n      <div style=\"font-size:46px;font-weight:600\">The loop<\u002Fdiv>\n      <div style=\"font-size:29px;color:#8A857B;line-height:1.4\">The work runs while nobody's watching.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Thirty Hours\" data-speaker-notes=\"Sept 2025: Anthropic's model stayed on one task autonomously for 30+ hours. [→] ~11,000 lines, no human in between. Two years earlier we were impressed by autocomplete.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:110px;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;align-items:baseline;gap:20px\">\n    <span style=\"font-size:520px;font-weight:700;line-height:0.9;letter-spacing:-0.04em;color:#85C168\">30<\u002Fspan>\n    <span style=\"font-size:80px;font-weight:500;color:#EDE8DF\">hrs<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:30px;font-family:'IBM Plex Mono',monospace;font-size:32px;color:#EDE8DF;line-height:1.5\">\n    <span data-frag=\"1\">one task, autonomously<\u002Fspan>\n    <span data-frag=\"1\" data-frag-delay=\"250\">≈11,000 lines of code<\u002Fspan>\n    <span data-frag=\"1\" data-frag-delay=\"500\">no human in between<\u002Fspan>\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Doubling Every Seven Months\" data-speaker-notes=\"METR measures how long a task AI can complete alone. [→] Doubling roughly every 7 months, [→] for six years straight. A Moore's Law for autonomy. Months of work now fits a five-hour session.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">How long can AI work on its own?<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;margin-top:30px\">\n    <svg width=\"1640\" height=\"640\" sc-camel-view-box=\"0 0 1640 640\">\n      <line x1=\"60\" y1=\"580\" x2=\"1600\" y2=\"580\" stroke=\"#EDE8DF\" stroke-width=\"2\" opacity=\"0.35\"><\u002Fline>\n      <line x1=\"60\" y1=\"580\" x2=\"60\" y2=\"40\" stroke=\"#EDE8DF\" stroke-width=\"2\" opacity=\"0.35\"><\u002Fline>\n      <line x1=\"60\" y1=\"420\" x2=\"1600\" y2=\"420\" stroke=\"#EDE8DF\" stroke-width=\"1\" opacity=\"0.12\"><\u002Fline>\n      <line x1=\"60\" y1=\"260\" x2=\"1600\" y2=\"260\" stroke=\"#EDE8DF\" stroke-width=\"1\" opacity=\"0.12\"><\u002Fline>\n      <line x1=\"60\" y1=\"100\" x2=\"1600\" y2=\"100\" stroke=\"#EDE8DF\" stroke-width=\"1\" opacity=\"0.12\"><\u002Fline>\n      <path data-frag=\"1\" data-frag-anim=\"draw\" d=\"M100 572 C 500 566, 800 550, 1050 490 C 1250 442, 1400 330, 1500 170 C 1530 120, 1550 90, 1565 68\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n      <circle data-frag=\"1\" data-frag-anim=\"fade\" cx=\"100\" cy=\"572\" r=\"9\" fill=\"#85C168\"><\u002Fcircle>\n      <circle data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"500\" cx=\"1050\" cy=\"490\" r=\"9\" fill=\"#85C168\"><\u002Fcircle>\n      <circle data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"1000\" cx=\"1565\" cy=\"68\" r=\"12\" fill=\"#85C168\"><\u002Fcircle>\n      <text x=\"100\" y=\"626\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"24\">2020 · seconds<\u002Ftext>\n      <text x=\"960\" y=\"626\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"24\">minutes<\u002Ftext>\n      <text x=\"1470\" y=\"626\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"24\">hours<\u002Ftext>\n      <text data-frag=\"2\" data-frag-anim=\"fade\" x=\"1130\" y=\"120\" fill=\"#EDE8DF\" font-family=\"Space Grotesk\" font-size=\"44\" font-weight=\"600\">2× every 7 months<\u002Ftext>\n      <text data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"300\" x=\"1130\" y=\"170\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"26\">six years straight<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  \n<\u002Fsection>\n\n<section data-label=\"Your Hardware Is Fixed\" data-speaker-notes=\"Here's the real asymmetry. Everything on the machine's side of this table compounds. Autonomy doubles every seven months — we just saw the curve. Need more? Spin up another loop. It runs all night. [→] Now read your column. Your hardware shipped three hundred thousand years ago, and there is no upgrade path. Working memory holds about four things at once. Reading speed sits near two hundred forty words a minute, and it hasn't moved since we started measuring. And you're offline a third of every day. [→] The machine scales. You don't. So the job cannot be reading everything the machines produce. Oversight is a different job than reading. Which raises the only question that matters tonight.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:74px;font-weight:600;letter-spacing:-0.02em;max-width:1560px\">Your hardware shipped 300,000 years ago.<\u002Fdiv>\n  <div style=\"border:1px solid #2A2A2E;margin-top:56px\">\n    <div style=\"display:grid;grid-template-columns:300px 1fr 1fr\">\n      <div style=\"padding:26px 44px\"><\u002Fdiv>\n      <div style=\"padding:26px 44px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.22em;color:#85C168;background:rgba(133,193,104,0.05)\">THE MACHINE<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.22em;color:#EDE8DF\">YOU<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"1\" style=\"display:grid;grid-template-columns:300px 1fr 1fr;border-top:1px solid #2A2A2E\">\n      <div style=\"padding:26px 44px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.15em;color:#6A6459;align-self:center\">AUTONOMY<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;font-weight:500;color:#85C168;background:rgba(133,193,104,0.05)\">doubles every 7 months<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;color:#EDE8DF\">fixed at birth<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"1\" data-frag-delay=\"140\" style=\"display:grid;grid-template-columns:300px 1fr 1fr;border-top:1px solid #2A2A2E\">\n      <div style=\"padding:26px 44px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.15em;color:#6A6459;align-self:center\">SCALE<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;font-weight:500;color:#85C168;background:rgba(133,193,104,0.05)\">need more? spin up another loop<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;color:#EDE8DF\">one attention · ~4 things at once<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"display:grid;grid-template-columns:300px 1fr 1fr;border-top:1px solid #2A2A2E\">\n      <div style=\"padding:26px 44px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.15em;color:#6A6459;align-self:center\">THROUGHPUT<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;font-weight:500;color:#85C168;background:rgba(133,193,104,0.05)\">any number of tokens, all night<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;color:#EDE8DF\">~240 words a minute · flat for a century<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"2\" data-frag-delay=\"140\" style=\"display:grid;grid-template-columns:300px 1fr 1fr;border-top:1px solid #2A2A2E\">\n      <div style=\"padding:26px 44px;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.15em;color:#6A6459;align-self:center\">UPTIME<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;font-weight:500;color:#85C168;background:rgba(133,193,104,0.05)\">24/7<\u002Fdiv>\n      <div style=\"padding:26px 44px;font-size:30px;color:#EDE8DF\">offline a third of every day<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"3\" style=\"font-size:44px;font-weight:500;line-height:1.35;margin-top:52px\">The machine scales. You don't. <span style=\"color:#85C168\">Overseeing is a different job than reading.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Overseers\" data-speaker-notes=\"We might never again babysit an agent turn by turn. [→] I'd like to call what we're becoming: overseers. [→] The way we work is changing underneath us.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:100px 140px;text-align:center;overflow:hidden\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#8A857B;letter-spacing:0.25em\">INNOVATOR → STORYTELLER → LEADER →<\u002Fdiv>\n  <div data-frag=\"1\" style=\"font-size:230px;font-weight:700;letter-spacing:-0.02em;line-height:1;margin-top:44px;color:#85C168\">Overseers<\u002Fdiv>\n  \n<\u002Fsection>\n\n<section data-label=\"How Do We Oversee?\" data-speaker-notes=\"The only question that actually matters tonight. [→] 'Overseer' sounds like a promotion, but a title without a method is just a word.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;position:relative;overflow:hidden\">\n  <div style=\"position:absolute;right:60px;bottom:-180px;font-size:900px;font-weight:700;color:transparent;-webkit-text-stroke:2px #2A2A2E;line-height:1\">?<\u002Fdiv>\n  <div style=\"font-size:150px;font-weight:600;line-height:1.1;letter-spacing:-0.02em;max-width:1300px\">How do we <span style=\"color:#85C168\">oversee<\u002Fspan>?<\u002Fdiv>\n  \n<\u002Fsection>\n\n<section data-label=\"The Oversight Gap\" data-speaker-notes=\"Why the question is urgent. Stack Overflow, 50k devs. [→] 84% use AI tools. [→] Only 1 in 3 trust it. Adoption sprints, trust walks backwards — the oversight gap. Closing it is our job.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">The oversight gap.<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:56px;\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#EDE8DF\">use AI tools<\u002Fdiv>\n      <div data-frag=\"1\" data-frag-anim=\"grow\" data-frag-to=\"84%\" style=\"width:84%;background:#85C168;height:110px;display:flex;align-items:center;justify-content:flex-end;padding-right:36px;box-sizing:border-box\"><span data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"700\" style=\"font-size:60px;font-weight:700;color:#0E0E10;white-space:nowrap\">84%<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div data-frag=\"2\" data-frag-anim=\"fade\" style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#EDE8DF\">trust what comes out<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:44px\">\n        <div data-frag=\"2\" data-frag-anim=\"grow\" data-frag-to=\"33%\" style=\"width:33%;height:110px;border:3px solid #EDE8DF;display:flex;align-items:center;justify-content:flex-end;padding-right:36px;box-sizing:border-box\"><span data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"700\" style=\"font-size:60px;font-weight:700;color:#EDE8DF;white-space:nowrap\">33%<\u002Fspan><\u002Fdiv>\n        <div data-frag=\"3\" style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#85C168;letter-spacing:0.1em;white-space:nowrap\">← the gap is our job now<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n<\u002Fsection>\n\n<section data-label=\"Comprehension Debt\" data-speaker-notes=\"A second gap underneath it. [→] Code shipped keeps climbing; code you understand doesn't keep up — comprehension debt. [→] Engineers building with AI score 17% lower, worst at debugging. [→] Duplicated code up 8×. [→] Tests green, PRs merged, nobody can explain why it works. It lives in you.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:74px;font-weight:600;letter-spacing:-0.02em\">Comprehension debt.<\u002Fdiv>\n  <div style=\"font-size:32px;color:#8A857B;margin-top:14px\">The gap between the code that exists and the code you understand.<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:90px;margin-top:10px\">\n    <svg data-frag=\"1\" width=\"980\" height=\"520\" sc-camel-view-box=\"0 0 980 520\" style=\"flex-shrink:0\">\n      <line x1=\"40\" y1=\"460\" x2=\"950\" y2=\"460\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"40\" y1=\"460\" x2=\"40\" y2=\"30\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Fline>\n      <path d=\"M 40 451 C 350 415, 620 240, 930 50 L 930 355 C 650 400, 350 435, 40 452 Z\" fill=\"rgba(212,85,58,0.08)\" stroke=\"none\"><\u002Fpath>\n      <path d=\"M 40 450 C 350 415, 620 240, 930 50\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"5\"><\u002Fpath>\n      <path d=\"M 40 452 C 350 435, 650 400, 930 355\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"5\" stroke-dasharray=\"2 10\" stroke-linecap=\"round\"><\u002Fpath>\n      <text x=\"922\" y=\"32\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"end\">code shipped<\u002Ftext>\n      <text x=\"922\" y=\"434\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"end\">code understood<\u002Ftext>\n      <line x1=\"880\" y1=\"105\" x2=\"880\" y2=\"345\" stroke=\"#D4553A\" stroke-width=\"3\"><\u002Fline>\n      <line x1=\"868\" y1=\"117\" x2=\"880\" y2=\"105\" stroke=\"#D4553A\" stroke-width=\"3\"><\u002Fline><line x1=\"892\" y1=\"117\" x2=\"880\" y2=\"105\" stroke=\"#D4553A\" stroke-width=\"3\"><\u002Fline>\n      <line x1=\"868\" y1=\"333\" x2=\"880\" y2=\"345\" stroke=\"#D4553A\" stroke-width=\"3\"><\u002Fline><line x1=\"892\" y1=\"333\" x2=\"880\" y2=\"345\" stroke=\"#D4553A\" stroke-width=\"3\"><\u002Fline>\n      <text x=\"858\" y=\"233\" fill=\"#D4553A\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"end\">the debt<\u002Ftext>\n    <\u002Fsvg>\n    <div style=\"display:flex;flex-direction:column;flex:1\">\n      <div data-frag=\"2\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-size:118px;font-weight:700;line-height:1;color:#D4553A\">−17%<\u002Fspan>\n        <span style=\"font-size:28px;color:#8A857B;line-height:1.4\">comprehension when engineers build with AI — worst at debugging<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#2A2A2E;margin:44px 0\"><\u002Fdiv>\n      <div data-frag=\"3\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-size:118px;font-weight:700;line-height:1;color:#D4553A\">8×<\u002Fspan>\n        <span style=\"font-size:28px;color:#8A857B;line-height:1.4\">more duplicated code blocks since AI took the keyboard<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"font-size:40px;font-weight:500;margin-top:36px\">Tests green. PRs merged. <span style=\"color:#D4553A\">Nobody can explain why it works.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Children of the Magenta\" data-speaker-notes=\"Pilots did this first. [→] They followed the autopilot's magenta line until they forgot how to fly — and when it quit mid-Atlantic, nobody aboard could recover the plane. [→] It's already us: doctors, writers, knowledge workers — the more they trusted the machine, the less they thought. [→] Aviation's fix wasn't less autopilot; it was mandated hand-flying. Ours: read what ships. Stay the engineer. Now the method — how do we oversee?\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:76px 140px;overflow:hidden\">\n  <div style=\"display:flex;align-items:baseline;gap:30px\">\n    <div style=\"font-size:72px;font-weight:600;letter-spacing:-0.02em\">We already know how this ends.<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:0.25em;color:#D96BD4;white-space:nowrap\">1997 · CHILDREN OF THE MAGENTA<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;margin-top:26px\">\n    <svg width=\"1640\" height=\"452\" sc-camel-view-box=\"0 0 1640 452\" style=\"width:100%;height:auto;max-height:378px\">\n      <!-- instrument grid -->\n      <line x1=\"0\" y1=\"120\" x2=\"1640\" y2=\"120\" stroke=\"#2A2A2E\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"215\" x2=\"1640\" y2=\"215\" stroke=\"#2A2A2E\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"310\" x2=\"1640\" y2=\"310\" stroke=\"#2A2A2E\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"418\" x2=\"1640\" y2=\"418\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Fline>\n      <line x1=\"410\" y1=\"60\" x2=\"410\" y2=\"418\" stroke=\"#2A2A2E\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"735\" y1=\"60\" x2=\"735\" y2=\"418\" stroke=\"#2A2A2E\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"1355\" y1=\"60\" x2=\"1355\" y2=\"418\" stroke=\"#2A2A2E\" stroke-width=\"1\"><\u002Fline>\n      <!-- planned / ideal route (static, dim, dashed) -->\n      <path d=\"M 40 408 C 520 372, 840 205, 1600 74\" fill=\"none\" stroke=\"#D96BD4\" stroke-width=\"3\" stroke-opacity=\"0.28\" stroke-dasharray=\"9 13\"><\u002Fpath>\n      <text x=\"1600\" y=\"58\" fill=\"#D96BD4\" fill-opacity=\"0.6\" font-family=\"IBM Plex Mono\" font-size=\"22\" text-anchor=\"end\">PLANNED ROUTE<\u002Ftext>\n      <!-- danger zone under the plunge -->\n      <path data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"300\" d=\"M 1060 150 C 1200 224, 1330 346, 1452 424 L 1060 424 Z\" fill=\"rgba(212,85,58,0.09)\" stroke=\"none\"><\u002Fpath>\n      <!-- autopilot climb: glow + main -->\n      <path data-frag=\"1\" data-frag-anim=\"draw\" d=\"M 40 408 C 430 380, 790 258, 1060 150\" fill=\"none\" stroke=\"#D96BD4\" stroke-width=\"16\" stroke-opacity=\"0.16\" stroke-linecap=\"round\"><\u002Fpath>\n      <path data-frag=\"1\" data-frag-anim=\"draw\" data-frag-delay=\"60\" d=\"M 40 408 C 430 380, 790 258, 1060 150\" fill=\"none\" stroke=\"#D96BD4\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n      <polygon data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"500\" points=\"432,323 442,333 432,343 422,333\" fill=\"#0E0E10\" stroke=\"#D96BD4\" stroke-width=\"2\"><\u002Fpolygon>\n      <polygon data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"640\" points=\"792,215 802,225 792,235 782,225\" fill=\"#0E0E10\" stroke=\"#D96BD4\" stroke-width=\"2\"><\u002Fpolygon>\n      <text data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"300\" x=\"40\" y=\"446\" fill=\"#D96BD4\" font-family=\"IBM Plex Mono\" font-size=\"23\" letter-spacing=\"3\">AUTOPILOT ENGAGED · 13 YEARS OF TRUST<\u002Ftext>\n      <!-- aircraft at the peak, still climbing -->\n      <g data-frag=\"1\" data-frag-anim=\"fade\" data-frag-delay=\"760\" transform=\"translate(1060,150) rotate(-24)\"><polygon points=\"26,0 -16,13 -16,-13\" fill=\"#EDE8DF\"><\u002Fpolygon><\u002Fg>\n      <!-- handoff marker -->\n      <line data-frag=\"2\" data-frag-anim=\"draw\" x1=\"1060\" y1=\"70\" x2=\"1060\" y2=\"424\" stroke=\"#EDE8DF\" stroke-width=\"2\" stroke-opacity=\"0.55\" stroke-dasharray=\"7 8\"><\u002Fline>\n      <text data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"120\" x=\"1060\" y=\"52\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"middle\" letter-spacing=\"2\">AUTOPILOT DISENGAGES<\u002Ftext>\n      <!-- the plunge: glow + main (red) -->\n      <path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"260\" d=\"M 1060 150 C 1200 224, 1330 346, 1452 424\" fill=\"none\" stroke=\"#D4553A\" stroke-width=\"18\" stroke-opacity=\"0.16\" stroke-linecap=\"round\"><\u002Fpath>\n      <path data-frag=\"2\" data-frag-anim=\"draw\" data-frag-delay=\"320\" d=\"M 1060 150 C 1200 224, 1330 346, 1452 424\" fill=\"none\" stroke=\"#D4553A\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n      <!-- tumbling aircraft at impact -->\n      <g data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"820\" transform=\"translate(1452,424) rotate(132)\"><polygon points=\"26,0 -16,13 -16,-13\" fill=\"#D4553A\"><\u002Fpolygon><\u002Fg>\n      <text data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"900\" x=\"1486\" y=\"372\" fill=\"#D4553A\" font-family=\"Space Grotesk\" font-size=\"34\" font-weight=\"700\">AF447<\u002Ftext>\n      <text data-frag=\"2\" data-frag-anim=\"fade\" data-frag-delay=\"980\" x=\"1486\" y=\"404\" fill=\"#D4553A\" font-family=\"IBM Plex Mono\" font-size=\"24\" letter-spacing=\"2\">228 LOST<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <div data-frag=\"3\" style=\"display:flex;align-items:stretch;gap:24px;margin-top:32px\">\n    <div style=\"display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:26px;color:#EDE8DF;letter-spacing:0.14em;white-space:nowrap;padding-right:6px\">It's already us —<\u002Fdiv>\n    <div style=\"flex:1;border:1px solid #2A2A2E;border-left:5px solid #D4553A;padding:20px 26px;display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:52px;font-weight:700;line-height:1;color:#D4553A\">−20%<\u002Fspan>\n      <span style=\"font-size:24px;color:#8A857B;line-height:1.35\">polyps found once the doctors switched the AI off<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:1px solid #2A2A2E;border-left:5px solid #D4553A;padding:20px 26px;display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:52px;font-weight:700;line-height:1;color:#D4553A\">83%<\u002Fspan>\n      <span style=\"font-size:24px;color:#8A857B;line-height:1.35\">couldn't quote the essay they'd just written with the LLM<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:1px solid #2A2A2E;border-left:5px solid #D4553A;padding:20px 26px;display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:40px;font-weight:700;line-height:1.15;color:#D4553A\">trust ↑ · thinking ↓<\u002Fspan>\n      <span style=\"font-size:24px;color:#8A857B;line-height:1.35\">more trust in the AI, less critical thinking applied<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"font-size:44px;font-weight:500;line-height:1.35;margin-top:30px\">Aviation's fix wasn't less autopilot — it was mandated hand-flying. <span style=\"color:#85C168\">Ours: read what the loop ships.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Oversight Ladder\" data-speaker-notes=\"So how do we oversee, without reading everything? A useful ladder. [→] In the loop: approve every step, the chat era. [→] On the loop: it runs, you monitor. [→] Out of the loop: it runs alone inside boundaries set in advance. [→] Warning: standing next to the loop doesn't count.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  \n  <div style=\"font-size: 64px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 30px\">The ladder.<\u002Fdiv><div style=\"display:grid;grid-template-columns:180px 320px 1fr;gap:36px 70px;align-items:center;\">\n    <svg data-frag=\"1\" width=\"140\" height=\"140\" sc-camel-view-box=\"0 0 140 140\"><circle cx=\"70\" cy=\"70\" r=\"55\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"70\" cy=\"70\" r=\"12\" fill=\"#85C168\"><\u002Fcircle><\u002Fsvg>\n    <div data-frag=\"1\" data-frag-delay=\"120\" style=\"font-size:48px;font-weight:600\">In the loop<\u002Fdiv>\n    <div data-frag=\"1\" data-frag-delay=\"240\" style=\"font-size:32px;color:#8A857B;line-height:1.4\">You approve every single step. The chat era.<\u002Fdiv>\n    <svg data-frag=\"2\" width=\"140\" height=\"140\" sc-camel-view-box=\"0 0 140 140\"><circle cx=\"70\" cy=\"70\" r=\"55\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"70\" cy=\"15\" r=\"12\" fill=\"#85C168\"><\u002Fcircle><\u002Fsvg>\n    <div data-frag=\"2\" data-frag-delay=\"120\" style=\"font-size:48px;font-weight:600\">On the loop<\u002Fdiv>\n    <div data-frag=\"2\" data-frag-delay=\"240\" style=\"font-size:32px;color:#8A857B;line-height:1.4\">It runs, you monitor, you can step in.<\u002Fdiv>\n    <svg data-frag=\"3\" width=\"140\" height=\"140\" sc-camel-view-box=\"0 0 140 140\"><rect x=\"6\" y=\"6\" width=\"128\" height=\"128\" rx=\"10\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\" stroke-dasharray=\"10 10\"><\u002Frect><circle cx=\"70\" cy=\"70\" r=\"40\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"70\" cy=\"70\" r=\"5\" fill=\"#EDE8DF\"><\u002Fcircle><\u002Fsvg>\n    <div data-frag=\"3\" data-frag-delay=\"120\" style=\"font-size:48px;font-weight:600\">Out of the loop<\u002Fdiv>\n    <div data-frag=\"3\" data-frag-delay=\"240\" style=\"font-size:32px;color:#8A857B;line-height:1.4\">It runs alone, inside boundaries you set in advance.<\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"margin-top:80px;font-family:'IBM Plex Mono',monospace;font-size:28px;color:#85C168;line-height:1.5\">If you can't inspect it, stop it, or veto it, that's not oversight. That's decoration.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Water We Swim In\" data-speaker-notes=\"[→] 99% of my workspace's code is LLM-written, I write the questions. [→] Google: 30%+ of new code, engineer-reviewed. Microsoft: 20–30%. [→] YC W25: a quarter of startups at 95% AI-written. [→] Not a loss, a dare to evolve.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size: 64px; font-weight: 600; letter-spacing: -0.01em; padding-bottom: 20px\">The water we swim in.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:80px;\">\n    <div data-frag=\"1\" style=\"display:flex;flex-direction:column;gap:24px\">\n      <span style=\"font-size:170px;font-weight:700;line-height:1;color:#85C168\">99%<\u002Fspan>\n      <span style=\"font-size:30px;color:#8A857B;line-height:1.45\">of my own workspace's code is LLM-written. I write the questions.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"display:flex;flex-direction:column;gap:24px\">\n      <span style=\"font-size:170px;font-weight:700;line-height:1\">30%<\u002Fspan>\n      <span style=\"font-size:30px;color:#8A857B;line-height:1.45\">of Google's new code: AI-generated, engineer-reviewed.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"3\" style=\"display:flex;flex-direction:column;gap:24px\">\n      <span style=\"font-size:170px;font-weight:700;line-height:1\">95%<\u002Fspan>\n      <span style=\"font-size:30px;color:#8A857B;line-height:1.45\">AI-written codebases in a quarter of YC's winter batch.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"margin-top:120px;font-size:44px;font-weight:500\">Not a loss. <span style=\"color:#85C168\">A dare to evolve.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Piece One: Design the Loop\" data-speaker-notes=\"Piece one: loop engineering. Making the agent smarter is hoping, not engineering. [→] An agent is a promise: 'trust me.' [→] A loop is a contract: goal, provable done, budget, stop.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"display:flex;align-items:center;gap:56px\">\n    <span style=\"font-size:190px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:3px #85C168\">1<\u002Fspan>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:0.3em;color:#85C168\">PIECE ONE<\u002Fspan>\n      <span style=\"font-size:76px;font-weight:600;letter-spacing:-0.01em\">Design the loop, not the agent<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:100px;margin-top:110px;align-items:start\">\n    <div data-frag=\"1\" style=\"display:flex;flex-direction:column;gap:36px;align-items:flex-start\">\n      <svg width=\"170\" height=\"170\" sc-camel-view-box=\"0 0 170 170\"><circle cx=\"85\" cy=\"85\" r=\"65\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"4\" stroke-dasharray=\"6 16\"><\u002Fcircle><\u002Fsvg>\n      <div style=\"font-size:44px;font-weight:600;color:#8A857B\">An agent is a promise.<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:30px;color:#8A857B\">\"trust me.\"<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"display:flex;flex-direction:column;gap:36px;align-items:flex-start\">\n      <svg width=\"170\" height=\"170\" sc-camel-view-box=\"0 0 170 170\"><circle cx=\"85\" cy=\"85\" r=\"65\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fcircle><line x1=\"85\" y1=\"8\" x2=\"85\" y2=\"34\" stroke=\"#85C168\" stroke-width=\"6\"><\u002Fline><line x1=\"85\" y1=\"136\" x2=\"85\" y2=\"162\" stroke=\"#85C168\" stroke-width=\"6\"><\u002Fline><line x1=\"8\" y1=\"85\" x2=\"34\" y2=\"85\" stroke=\"#85C168\" stroke-width=\"6\"><\u002Fline><line x1=\"136\" y1=\"85\" x2=\"162\" y2=\"85\" stroke=\"#85C168\" stroke-width=\"6\"><\u002Fline><\u002Fsvg>\n      <div style=\"font-size:44px;font-weight:600\">A loop is a contract.<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:30px;color:#85C168\">goal · provable \"done\" · budget · stop<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section data-label=\"Five Walls, Written First\" data-speaker-notes=\"A well-engineered loop has five things, written before anything runs. [→] A goal with a checkable 'done.' [→] Gates. [→] A budget. [→] Isolation. [→] A stop condition. [→] Design these five and you can walk away while it runs.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">Five walls, written first.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:36px;flex:1;align-content:start\">\n    <div data-frag=\"1\" style=\"border:2px solid #2A2A2E;border-top:8px solid #85C168;padding:40px 36px;display:flex;flex-direction:column;gap:22px\">\n      <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\"><circle cx=\"36\" cy=\"36\" r=\"27\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"36\" cy=\"36\" r=\"13\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"36\" cy=\"36\" r=\"4\" fill=\"#85C168\"><\u002Fcircle><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">01<\u002Fspan>\n      <span style=\"font-size:42px;font-weight:600\">Goal<\u002Fspan>\n      <span style=\"font-size:27px;color:#8A857B;line-height:1.4\">A checkable definition of \"done.\"<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"2\" style=\"border:2px solid #2A2A2E;border-top:8px solid #85C168;padding:40px 36px;display:flex;flex-direction:column;gap:22px\">\n      <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\"><rect x=\"8\" y=\"14\" width=\"16\" height=\"44\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Frect><rect x=\"48\" y=\"14\" width=\"16\" height=\"44\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Frect><path d=\"M28 38 L34 44 L45 28\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">02<\u002Fspan>\n      <span style=\"font-size:42px;font-weight:600\">Gates<\u002Fspan>\n      <span style=\"font-size:27px;color:#8A857B;line-height:1.4\">Checks the work must pass.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"3\" style=\"border:2px solid #2A2A2E;border-top:8px solid #85C168;padding:40px 36px;display:flex;flex-direction:column;gap:22px\">\n      <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\"><path d=\"M12 54 A26 26 0 1 1 60 54\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fpath><line x1=\"36\" y1=\"54\" x2=\"52\" y2=\"30\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fline><circle cx=\"36\" cy=\"54\" r=\"5\" fill=\"#85C168\"><\u002Fcircle><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">03<\u002Fspan>\n      <span style=\"font-size:42px;font-weight:600\">Budget<\u002Fspan>\n      <span style=\"font-size:27px;color:#8A857B;line-height:1.4\">Tokens, time, money. Declared up front.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"4\" style=\"border:2px solid #2A2A2E;border-top:8px solid #85C168;padding:40px 36px;display:flex;flex-direction:column;gap:22px\">\n      <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\"><rect x=\"8\" y=\"8\" width=\"56\" height=\"56\" rx=\"6\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\" stroke-dasharray=\"8 8\"><\u002Frect><circle cx=\"36\" cy=\"36\" r=\"10\" fill=\"none\" stroke=\"#85C168\" stroke-width=\"4\"><\u002Fcircle><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">04<\u002Fspan>\n      <span style=\"font-size:42px;font-weight:600\">Isolation<\u002Fspan>\n      <span style=\"font-size:27px;color:#8A857B;line-height:1.4\">A sandbox. Contained blast radius.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-frag=\"5\" style=\"border:2px solid #2A2A2E;border-top:8px solid #85C168;padding:40px 36px;display:flex;flex-direction:column;gap:22px\">\n      <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 72 72\"><path d=\"M24 8 L48 8 L64 24 L64 48 L48 64 L24 64 L8 48 L8 24 Z\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fpath><line x1=\"26\" y1=\"36\" x2=\"46\" y2=\"36\" stroke=\"#85C168\" stroke-width=\"5\"><\u002Fline><\u002Fsvg>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#85C168\">05<\u002Fspan>\n      <span style=\"font-size:42px;font-weight:600\">Stop<\u002Fspan>\n      <span style=\"font-size:27px;color:#8A857B;line-height:1.4\">A condition that halts it.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"6\" style=\"font-size:44px;font-weight:500;margin-top:20px\">Design these five, <span style=\"color:#85C168\">and you can walk away.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Loops You Already Have\" data-speaker-notes=\"So who writes the walls? Claude Code already ships loop primitives. [→] /goal hands off the stop condition, a persistent objective, checked until satisfied. But the same vendor grades its own stop. [→] /loop and /schedule hand off the trigger, schedulers, not designers. [→] /looper is the design layer in front: coached goal, typed verification, a judge from a different model family, written down before anything runs. [→] Primitives run the loop. Design decides what's worth running.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-top:28px\">What's the difference?<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:400px 440px 1fr;gap:44px 60px;margin-top:80px;align-items:center;flex:1;align-content:center\">\n    <div data-frag=\"1\" style=\"border:2px solid #2A2A2E;padding:26px 36px;font-family:'IBM Plex Mono',monospace;font-size:38px;color:#EDE8DF\">/goal<\u002Fdiv>\n    <div data-frag=\"1\" data-frag-delay=\"120\" style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#8A857B;letter-spacing:0.2em\">YOU HAND OFF<\u002Fspan><span style=\"font-size:42px;font-weight:600\">the stop condition<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"1\" data-frag-delay=\"240\" style=\"font-size:28px;color:#8A857B;line-height:1.45\">Persists until the state satisfies the goal, but the same vendor grades its own stop.<\u002Fdiv>\n    <div data-frag=\"2\" style=\"border:2px solid #2A2A2E;padding:26px 36px;font-family:'IBM Plex Mono',monospace;font-size:38px;color:#EDE8DF\">/loop<\u002Fdiv>\n    <div data-frag=\"2\" data-frag-delay=\"120\" style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#8A857B;letter-spacing:0.2em\">YOU HAND OFF<\u002Fspan><span style=\"font-size:42px;font-weight:600\">the trigger<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"2\" data-frag-delay=\"240\" style=\"font-size:28px;color:#8A857B;line-height:1.45\">A scheduler: re-fires the task on a cadence. It never asks if the task is worth firing.<\u002Fdiv>\n    <div data-frag=\"3\" style=\"border:2px solid #85C168;background:rgba(133,193,104,0.08);padding:26px 36px;font-family:'IBM Plex Mono',monospace;font-size:38px;color:#85C168\">/looper<\u002Fdiv>\n    <div data-frag=\"3\" data-frag-delay=\"120\" style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">YOU HAND OFF<\u002Fspan><span style=\"font-size:42px;font-weight:600\">the design<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"3\" data-frag-delay=\"240\" style=\"font-size:28px;color:#8A857B;line-height:1.45\">The layer in front: a coached goal, typed verification, a judge from a <span style=\"color:#EDE8DF\">different model family<\u002Fspan>.<\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"margin-top:40px\">\n    <span style=\"font-size:40px;font-weight:500\">Primitives run the loop. <span style=\"color:#85C168\">Design decides what's worth running.<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Looper Framework\" data-speaker-notes=\"This is the five walls assembled into a pipeline — how the loop actually runs. [→] Goal and context go in, the host model drafts plan.md — and the plan immediately hits a gate: an independent reviewer judges it. Fail, revise, at most three times. [→] Pass, and the loop maps the work into delivery files. Second gate: programmatic checks plus a judge. Same rule — revise up to three, or pass. Only then does output ship, all gates clean. [→] Underneath, everything is recorded — state.json, a run log. The loop can't lie about what it did. [→] And stop guards watch both gates the whole run: twelve iterations max, two stalls and it halts, hard budget caps. Nothing here is clever. Every box is a document. Every gate is a rule.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:60px;font-weight:600;letter-spacing:-0.01em;margin-top:20px\">Five walls, assembled into a pipeline.<\u002Fdiv>\n  <svg width=\"1640\" height=\"590\" sc-camel-view-box=\"0 -34 1640 590\" style=\"margin-top:26px\">\n    <defs>\n      <marker id=\"lpA\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#8A857B\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"lpG\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#85C168\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"lpR\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#D4553A\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n    <g data-frag=\"3\">\n      <rect x=\"306\" y=\"110\" width=\"230\" height=\"128\" fill=\"#0E0E10\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <rect x=\"294\" y=\"98\" width=\"230\" height=\"128\" fill=\"#0E0E10\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <rect x=\"892\" y=\"110\" width=\"230\" height=\"128\" fill=\"#0E0E10\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <rect x=\"880\" y=\"98\" width=\"230\" height=\"128\" fill=\"#0E0E10\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n    <\u002Fg>\n    <g data-frag=\"4\">\n      <polygon points=\"680,46 826,150 680,254 534,150\" fill=\"none\" stroke=\"#D4553A\" stroke-width=\"2\" stroke-dasharray=\"9 11\" stroke-opacity=\"0.85\"><\u002Fpolygon>\n      <polygon points=\"1266,46 1412,150 1266,254 1120,150\" fill=\"none\" stroke=\"#D4553A\" stroke-width=\"2\" stroke-dasharray=\"9 11\" stroke-opacity=\"0.85\"><\u002Fpolygon>\n    <\u002Fg>\n    <g data-frag=\"1\">\n      <rect x=\"0\" y=\"86\" width=\"220\" height=\"128\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"110\" y=\"158\" fill=\"#EDE8DF\" font-family=\"Space Grotesk\" font-size=\"25\" font-weight=\"600\" text-anchor=\"middle\">Goal + context<\u002Ftext>\n      <line x1=\"220\" y1=\"150\" x2=\"274\" y2=\"150\" stroke=\"#8A857B\" stroke-width=\"2.5\" marker-end=\"url(#lpA)\"><\u002Fline>\n      <rect x=\"282\" y=\"86\" width=\"230\" height=\"128\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"397\" y=\"158\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"28\" text-anchor=\"middle\">plan.md<\u002Ftext>\n      <line x1=\"512\" y1=\"150\" x2=\"542\" y2=\"150\" stroke=\"#8A857B\" stroke-width=\"2.5\" marker-end=\"url(#lpA)\"><\u002Fline>\n      <polygon points=\"680,72 810,150 680,228 550,150\" fill=\"#17171B\" stroke=\"#85C168\" stroke-width=\"2.5\"><\u002Fpolygon>\n      <text x=\"680\" y=\"144\" fill=\"#EDE8DF\" font-family=\"Space Grotesk\" font-size=\"24\" font-weight=\"600\" text-anchor=\"middle\">PLAN GATE<\u002Ftext>\n      <text x=\"680\" y=\"176\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">judge: reviewer-1<\u002Ftext>\n      <path d=\"M 680 72 C 680 -6, 397 -6, 397 84\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"2\" stroke-dasharray=\"7 7\" marker-end=\"url(#lpA)\"><\u002Fpath>\n      <text x=\"538\" y=\"12\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"20\" text-anchor=\"middle\">revise ≤ 3<\u002Ftext>\n    <\u002Fg>\n    <g data-frag=\"2\">\n      <line x1=\"810\" y1=\"150\" x2=\"856\" y2=\"150\" stroke=\"#85C168\" stroke-width=\"2.5\" marker-end=\"url(#lpG)\"><\u002Fline>\n      <text x=\"836\" y=\"132\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"18\" text-anchor=\"middle\">pass<\u002Ftext>\n      <rect x=\"868\" y=\"86\" width=\"230\" height=\"128\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"983\" y=\"158\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"28\" text-anchor=\"middle\">delivery-N.md<\u002Ftext>\n      <line x1=\"1098\" y1=\"150\" x2=\"1128\" y2=\"150\" stroke=\"#8A857B\" stroke-width=\"2.5\" marker-end=\"url(#lpA)\"><\u002Fline>\n      <polygon points=\"1266,72 1396,150 1266,228 1136,150\" fill=\"#17171B\" stroke=\"#85C168\" stroke-width=\"2.5\"><\u002Fpolygon>\n      <text x=\"1266\" y=\"144\" fill=\"#EDE8DF\" font-family=\"Space Grotesk\" font-size=\"24\" font-weight=\"600\" text-anchor=\"middle\">DELIVERY GATE<\u002Ftext>\n      <text x=\"1266\" y=\"176\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">checks + judge<\u002Ftext>\n      <path d=\"M 1266 72 C 1266 -6, 983 -6, 983 84\" fill=\"none\" stroke=\"#8A857B\" stroke-width=\"2\" stroke-dasharray=\"7 7\" marker-end=\"url(#lpA)\"><\u002Fpath>\n      <text x=\"1124\" y=\"12\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"20\" text-anchor=\"middle\">revise ≤ 3<\u002Ftext>\n      <line x1=\"1396\" y1=\"150\" x2=\"1424\" y2=\"150\" stroke=\"#85C168\" stroke-width=\"2.5\" marker-end=\"url(#lpG)\"><\u002Fline>\n      <text x=\"1412\" y=\"132\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"18\" text-anchor=\"middle\">pass<\u002Ftext>\n      <rect x=\"1432\" y=\"86\" width=\"208\" height=\"128\" fill=\"rgba(133,193,104,0.08)\" stroke=\"#85C168\" stroke-width=\"2.5\"><\u002Frect>\n      <text x=\"1536\" y=\"146\" fill=\"#85C168\" font-family=\"Space Grotesk\" font-size=\"25\" font-weight=\"600\" text-anchor=\"middle\">Final output<\u002Ftext>\n      <text x=\"1536\" y=\"182\" fill=\"#85C168\" font-family=\"IBM Plex Mono\" font-size=\"18\" text-anchor=\"middle\">all gates clean<\u002Ftext>\n    <\u002Fg>\n    <g data-frag=\"3\">\n      <rect x=\"40\" y=\"464\" width=\"46\" height=\"32\" fill=\"#17171B\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Frect>\n      <rect x=\"50\" y=\"474\" width=\"46\" height=\"32\" fill=\"#17171B\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Frect>\n      <rect x=\"60\" y=\"484\" width=\"46\" height=\"32\" fill=\"#17171B\" stroke=\"#8A857B\" stroke-width=\"1.5\"><\u002Frect>\n      <text x=\"140\" y=\"486\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"22\" letter-spacing=\"2\">STATE + LOG — every step recorded<\u002Ftext>\n      <text x=\"140\" y=\"516\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"20\">state.json · run-log.md — the loop can't lie<\u002Ftext>\n    <\u002Fg>\n    <g data-frag=\"4\">\n      <polygon points=\"930,460 964,494 930,528 896,494\" fill=\"none\" stroke=\"#D4553A\" stroke-width=\"2\" stroke-dasharray=\"7 8\"><\u002Fpolygon>\n      <text x=\"1000\" y=\"486\" fill=\"#D4553A\" font-family=\"IBM Plex Mono\" font-size=\"22\" letter-spacing=\"2\">STOP GUARDS on every gate<\u002Ftext>\n      <text x=\"1000\" y=\"516\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"20\">max 12 iterations · no progress ×2 · budget caps<\u002Ftext>\n    <\u002Fg>\n  <\u002Fsvg>\n  <div data-frag=\"5\" style=\"font-size:38px;font-weight:500;margin-top:26px\">Boxes are documents. <span style=\"color:#85C168\">Gates are rules.<\u002Fspan> <span style=\"color:#D4553A\">Guards are limits.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Install the Loop\" data-speaker-notes=\"And installing it is one line. [→] curl the installer, pipe to bash — it drops the skill and the /looper command into ~/.claude. [→] Open Claude Code, type /looper, and the design interview starts. [→] Under the hood it's markdown and YAML, so the design ports anywhere: Cursor rules, AGENTS.md, any harness that reads instructions. The loop isn't software you install. It's a document you write.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-top:28px\">Installation<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;margin-top:30px\">\n    <div style=\"width:100%;background:#17171B;border:1px solid #2A2A2E\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:20px 32px;border-bottom:1px solid #2A2A2E\">\n        <span style=\"width:14px;height:14px;border-radius:50%;background:#2A2A2E\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:#2A2A2E\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:#2A2A2E\"><\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;color:#8A857B;margin-left:14px\">terminal<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:44px 52px;font-family:'IBM Plex Mono',monospace;font-size:31px;line-height:2.1;display:flex;flex-direction:column\">\n        <span data-frag=\"1\"><span style=\"color:#85C168\">$<\u002Fspan> curl -fsSL raw.githubusercontent.com/ksimback/looper/main/install.sh <span style=\"color:#EDE8DF\">| bash<\u002Fspan><\u002Fspan>\n        <span data-frag=\"1\" data-frag-delay=\"160\" style=\"color:#8A857B\">installed: ~/.claude/skills/looper · /looper command<\u002Fspan>\n        <span data-frag=\"3\" style=\"margin-top:18px\"><span style=\"color:#85C168\">$<\u002Fspan> claude<\u002Fspan>\n        <span data-frag=\"3\" data-frag-delay=\"160\"><span style=\"color:#85C168\">&gt;<\u002Fspan> /looper <span style=\"color:#8A857B\">\"ship the auth refactor\"<\u002Fspan> <span style=\"animation:livePulse 1.1s step-end infinite;color:#85C168\">▌<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"font-size:40px;font-weight:500;margin-top:34px;line-height:1.4\">The loop is a document, <span style=\"color:#85C168\">not a dependency.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Landscape\" data-speaker-notes=\"And this isn't just philosophy, it's a market. [→] Single loops: Ralph Orchestrator. The design layer: Looper. [→] Fleets: Gastown, Yegge's 'Kubernetes for agents.' Graphs: LangGraph, approval gates first-class. [→] Enterprise: Microsoft Agent Framework, GA April 2026. Durability: Temporal. [→] Different shapes, every one ships the same walls: gates, budgets, isolation, stop.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-bottom:48px\">The landscape, July 2026.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;flex:1;align-content:center\">\n    <div data-frag=\"1\" style=\"border:2px solid #2A2A2E;padding:40px 38px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">SINGLE LOOP<\u002Fspan><span style=\"font-size:42px;font-weight:600\">Ralph Orchestrator<\u002Fspan><span style=\"font-size:26px;color:#8A857B;line-height:1.4\">One agent, looped until done. Backpressure gates reject incomplete work.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"1\" data-frag-delay=\"150\" style=\"border:2px solid #2A2A2E;padding:40px 38px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">DESIGN LAYER<\u002Fspan><span style=\"font-size:42px;font-weight:600\">Looper<\u002Fspan><span style=\"font-size:26px;color:#8A857B;line-height:1.4\">Coaches the loop before it runs: typed checks, cross-model judge, caps.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"2\" style=\"border:2px solid #2A2A2E;padding:40px 38px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">AGENT FLEET<\u002Fspan><span style=\"font-size:42px;font-weight:600\">Gastown<\u002Fspan><span style=\"font-size:26px;color:#8A857B;line-height:1.4\">Yegge's agent factory: “Kubernetes for agents,” git-backed work state.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"2\" data-frag-delay=\"150\" style=\"border:2px solid #2A2A2E;padding:40px 38px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">GRAPH<\u002Fspan><span style=\"font-size:42px;font-weight:600\">LangGraph<\u002Fspan><span style=\"font-size:26px;color:#8A857B;line-height:1.4\">Stateful, cyclic graphs. Human approval gates as a first-class feature.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"3\" style=\"border:2px solid #2A2A2E;padding:40px 38px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">ENTERPRISE<\u002Fspan><span style=\"font-size:42px;font-weight:600\">MS Agent Framework<\u002Fspan><span style=\"font-size:26px;color:#8A857B;line-height:1.4\">Semantic Kernel + AutoGen, consolidated. 1.0 GA, April 2026.<\u002Fspan><\u002Fdiv>\n    <div data-frag=\"3\" data-frag-delay=\"150\" style=\"border:2px solid #2A2A2E;padding:40px 38px;display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;color:#85C168;letter-spacing:0.2em\">DURABILITY<\u002Fspan><span style=\"font-size:42px;font-weight:600\">Temporal<\u002Fspan><span style=\"font-size:26px;color:#8A857B;line-height:1.4\">Loops that survive crashes: durable execution, approval pauses.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-frag=\"4\" style=\"margin-top:50px\">\n    <span style=\"font-size:42px;font-weight:500;white-space:nowrap\">Different shapes. <span style=\"color:#85C168\">Same walls: gates · budgets · isolation · stop.<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Sit on the Loop\" data-speaker-notes=\"Geoffrey Huntley's line sums up the whole talk. Not fringe: Anthropic's guidance says simplest thing first; LangGraph ships approval gates first-class. The industry converged: don't trust the agent, design the loop.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:100px 160px;text-align:center;overflow:hidden\">\n  <svg width=\"180\" height=\"150\" sc-camel-view-box=\"0 0 180 150\"><circle cx=\"90\" cy=\"100\" r=\"46\" fill=\"none\" stroke=\"#EDE8DF\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"90\" cy=\"36\" r=\"14\" fill=\"#85C168\"><\u002Fcircle><\u002Fsvg>\n  <div style=\"font-size:118px;font-weight:600;line-height:1.15;letter-spacing:-0.01em;max-width:1500px\">“Sit <span style=\"color:#85C168\">on<\u002Fspan> the loop, not <span style=\"color:#85C168\">in<\u002Fspan> it.”<\u002Fdiv>\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;color:#8A857B;margin-top:70px;letter-spacing:0.2em\">GEOFFREY HUNTLEY<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The Quant Loop\" data-speaker-notes=\"So here's my actual workflow — one turn of the desk, drawn as a loop. [→] Offline: an idea, stated as a hypothesis with constraints. Generate a strategy version. Backtest it on a deterministic tape. [→] Then the gate. Rubric, budgets, risk limits. Human-owned. The agent works within it, never around it. [→] Pass, and it deploys — testnet first, then production, where it operates and monitors on the live tape. [→] And the loop closes: analyze the tape diffs, tune the parameters, feed the next idea. On a human desk one turn takes days, and most of that isn't thinking — it's machine-shaped work. Wiring data. Re-running backtests. Reconciling results. We run the turn in minutes, continuously. [→] And zoom into any one phase — it's the same shape again. Each phase runs as its own loop: its own goal, typed gates, an independent judge council, a declared budget. Loops all the way down.\" style=\"box-sizing:border-box;background:#0E0E10;color:#EDE8DF;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:100px 140px;overflow:hidden\">\n  <div style=\"font-size:64px;font-weight:600;letter-spacing:-0.01em;margin-top:20px\">One turn of the desk, drawn as a loop.<\u002Fdiv>\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:0.3em;color:#85C168;order:-1\">PIECE TWO · PRACTIAL APPLICATION<\u002Fdiv>\n  <svg width=\"1640\" height=\"560\" sc-camel-view-box=\"0 0 1640 560\" style=\"margin-top:34px\">\n    <defs>\n      <marker id=\"qlA\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#8A857B\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"qlG\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#85C168\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n    <g data-frag=\"1\">\n      <text x=\"0\" y=\"40\" fill=\"#8A857B\" font-family=\"IBM Plex Mono\" font-size=\"21\" letter-spacing=\"4\">OFFLINE · BUILD &amp; VALIDATE<\u002Ftext>\n      <rect x=\"0\" y=\"90\" width=\"200\" height=\"120\" fill=\"#17171B\" stroke=\"#2A2A2E\" stroke-width=\"2\"><\u002Frect>\n      <text x=\"100\" y=\"146\" fill=\"#EDE8DF\" font-family=\"IBM Plex Mono\" font-size=\"24\" text-anchor=\"middle\">IDEA<\u002Ftext>\n      <text x=\"100\" y=\"180\" fill=\"#6A6459\" font-family=\"IBM Plex Mono\" font-size=\"17\" text-anchor=\"middle\">hypothesis<\u002Ftext>\n      <line x1=\"200\" y1=\"150\" x2=\"242\" y2=\"150\" stroke=\"#8A857B\" stroke-width=\"2.5\" marker-end=\"url(
